<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stilessheet"hre="styles.css">
    <title>Cartão de Visitas</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .card {
            background-color: #ffffff;
            width: 350px;
            height: 200px;
            border-radius: 10px;
            box-shadow: 0 4px 8px 10px rgba(0,0,0,0.1);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .titulo {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #2196F3, #00BCD4);
        }

        .sub .titulo {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            border-bottom: 2px solid #00BCD4;
            padding-bottom: 5px;
        }

        .contact-info {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .contact-info p {
            margin: 5px 0;
        }

        .card:hover {
            transform: translateY(-5px);
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="name">José Ailton Teixeira dos Santos</div>
        <div class="contact-info">
            <p>📱 (85) 98161-7574</p>
            <p>✉️ joseailton_@live.com</p>
            <p>🏢 Desenvolvedor Full stack</p>
            <p>📍 Av Huberto Monte 2020 </p>
        </div>
    </div>
</body>
</html>
